<title>Vatave Healthcare Sales OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: fixed module rail on the left + scrolling workspace; on phones the rail becomes a sticky strip of module tabs */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --surface-2:#eaf0f4; --line:#d9e1e8; --fg:#122029; --muted:#5a6b79;
  --accent:#1b5ea6; --accent-fg:#ffffff; --accent-soft:#e1ebf7;
  --ai:#a3510b; --ai-soft:#fbeedf;
  --good:#1b7346; --good-soft:#e0f1e7; --warn:#946509; --warn-soft:#fbf0d6; --bad:#b0261e; --bad-soft:#fbe4e1;
  --wa-bg:#e9e3d8; --wa-in:#ffffff; --wa-out:#d5f3c6; --wa-head:#0d6652; --wa-fg:#14202a;
  --shadow:0 1px 2px rgba(18,32,41,.05),0 6px 20px rgba(18,32,41,.06);
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,"Noto Sans","Nirmala UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1419; --surface:#141d24; --surface-2:#1a252e; --line:#26343f; --fg:#e4ecf2; --muted:#8fa2b2;
  --accent:#6aa6ea; --accent-fg:#0b1620; --accent-soft:#182b40;
  --ai:#f0a660; --ai-soft:#33220f;
  --good:#52c48d; --good-soft:#123020; --warn:#e2b24e; --warn-soft:#33280e; --bad:#f27a6c; --bad-soft:#3a1714;
  --wa-bg:#0f1a16; --wa-in:#1d2a24; --wa-out:#164a33; --wa-head:#12493b; --wa-fg:#e4ecf2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1419; --surface:#141d24; --surface-2:#1a252e; --line:#26343f; --fg:#e4ecf2; --muted:#8fa2b2;
  --accent:#6aa6ea; --accent-fg:#0b1620; --accent-soft:#182b40;
  --ai:#f0a660; --ai-soft:#33220f;
  --good:#52c48d; --good-soft:#123020; --warn:#e2b24e; --warn-soft:#33280e; --bad:#f27a6c; --bad-soft:#3a1714;
  --wa-bg:#0f1a16; --wa-in:#1d2a24; --wa-out:#164a33; --wa-head:#12493b; --wa-fg:#e4ecf2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.45rem;font-weight:600}
h2{font-size:1.02rem;font-weight:600}
h3{font-size:.92rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);
  padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center}
#brandLogo{display:flex}
.brand b{font-family:var(--f-display);font-size:1rem;display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:.74rem;letter-spacing:.04em}
.logo{width:36px;height:36px;flex:none;display:block}
.logo .bg{fill:var(--accent)} .logo .l{fill:var(--accent-fg)} .logo .r{fill:var(--ai-soft)}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navgrp>span{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:0 10px 4px;font-weight:600}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:500;font-size:.88rem}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav i{font-style:normal;font-size:.7rem;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--bad-soft);color:var(--bad)}
.nav i.ai{background:var(--ai-soft);color:var(--ai)}
.nav i.new{background:var(--accent);color:var(--accent-fg)}
.rail-foot{margin-top:auto;font-size:.74rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

.main{min-width:0;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ask{flex:1 1 340px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 12px;min-width:0}
.ask input{flex:1;min-width:0;border:0;background:transparent;padding:6px 2px;outline:none}
.who{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:.78rem;flex:none}
.demo{font-size:.72rem;color:var(--warn);background:var(--warn-soft);padding:3px 9px;border-radius:999px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 11px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vhead p{color:var(--muted);margin-top:4px;max-width:72ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card>h2,.card>.ch{margin-bottom:12px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.g4,.g2{grid-template-columns:minmax(0,1fr)}}

.kpi .lbl{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .val{font-family:var(--f-display);font-size:1.6rem;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:.8rem;color:var(--muted);margin-top:2px}
.kpi.risk{border-color:var(--bad);background:linear-gradient(var(--bad-soft),var(--surface) 70%)}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.meter>b{display:block;height:100%;background:var(--accent);border-radius:99px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.ai{background:var(--ai-soft);color:var(--ai)}
.ai-tag{font-family:var(--f-mono);font-size:.68rem;font-weight:500;padding:1px 6px;border-radius:5px;background:var(--ai-soft);color:var(--ai);letter-spacing:.04em;white-space:nowrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:.84rem;white-space:nowrap}
a.btn{text-decoration:none;color:var(--fg);display:inline-block}
a.btn-primary{color:var(--accent-fg)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.55;cursor:wait}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{color:var(--accent-fg);filter:brightness(1.08)}
.btn-ai{background:var(--ai-soft);border-color:transparent;color:var(--ai)}
.btn-sm{padding:3px 9px;font-size:.78rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.8rem;font-weight:500}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.tbl{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tsub{display:block;color:var(--muted);font-size:.76rem}

.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.task:last-child{border-bottom:0}
.task .bar{align-self:stretch;border-radius:4px;background:var(--line)}
.task .bar.bad{background:var(--bad)} .task .bar.warn{background:var(--warn)} .task .bar.accent{background:var(--accent)} .task .bar.ai{background:var(--ai)}
.task b{font-weight:600;display:block}
.task small{color:var(--muted);font-size:.8rem;display:block}

.chart svg{width:100%;height:auto;display:block}
.chart .tick{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .b{fill:var(--accent)} .chart .b.mtd{fill:var(--ai)}
.chart .vl{fill:var(--fg);font-size:11px;font-family:var(--f-mono);font-weight:500}
.hbar{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:.84rem}
.hbar .trk{position:relative;height:12px;background:var(--surface-2);border-radius:4px}
.hbar .trk b{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.hbar .trk b.over{background:var(--good)}
.hbar .trk u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);text-decoration:none}

.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{display:flex;justify-content:space-between;font-size:.8rem;padding:2px 4px}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.lead:hover{border-color:var(--accent)}
.lead .t{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.lead b{font-size:.86rem}
.lead small{font-size:.76rem;color:var(--muted)}
.score{font-family:var(--f-mono);font-size:.74rem;font-weight:500;padding:1px 6px;border-radius:5px}
.score.hot{background:var(--bad-soft);color:var(--bad)} .score.warm{background:var(--warn-soft);color:var(--warn)} .score.cold{background:var(--surface-2);color:var(--muted)}
.lead.flash{animation:flash 1.6s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--ai)}100%{box-shadow:0 0 0 0 transparent}}

.scrim{position:fixed;inset:0;background:rgba(8,16,22,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:41;border-left:1px solid var(--line);overflow-y:auto;
  padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.draft{background:var(--wa-out);color:var(--wa-fg);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:.86rem}
.reasons{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;font-size:.84rem}
.reasons li{display:flex;gap:8px}
.reasons li span{font-family:var(--f-mono);font-weight:500;min-width:34px;flex:none}

.phone{max-width:390px;width:100%;margin:0 auto;border-radius:28px;border:8px solid var(--fg);overflow:hidden;background:var(--wa-bg);display:flex;flex-direction:column;height:640px;box-shadow:var(--shadow)}
.wa-h{background:var(--wa-head);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center}
.wa-h .avatar{background:#fff;color:var(--wa-head)}
.wa-h small{display:block;opacity:.8;font-size:.72rem}
.wa-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:8px 10px 4px;border-radius:9px;font-size:.84rem;color:var(--wa-fg);box-shadow:0 1px 1px rgba(0,0,0,.08)}
.msg.ai{background:var(--wa-in);align-self:flex-start;border-top-left-radius:2px}
.msg.me{background:var(--wa-out);align-self:flex-end;border-top-right-radius:2px}
.msg ol{margin:6px 0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.msg time{display:block;text-align:right;font-size:.66rem;opacity:.6;margin-top:2px}
.msg .done{text-decoration:line-through;opacity:.55}
.msg .tr{border-top:1px dashed currentColor;margin-top:6px;padding-top:5px;font-size:.8rem;opacity:.85}
.msg .tr span{font-family:var(--f-mono);font-size:.66rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;opacity:.75;display:block}
.msg .orig{font-size:.95rem;line-height:1.55}
.voice{display:flex;align-items:center;gap:8px}
.voice .wave{display:flex;gap:2px;align-items:center;height:20px}
.voice .wave i{width:3px;background:currentColor;opacity:.55;border-radius:2px}
.qcard{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:7px;padding:8px;margin:4px 0}
.qcard .pdf{font-family:var(--f-mono);font-size:.66rem;font-weight:500;background:var(--bad);color:#fff;border-radius:4px;padding:6px 5px}
.typing{align-self:flex-start;background:var(--wa-in);border-radius:9px;padding:8px 12px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bob 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-4px)}}
.wa-q{padding:8px;display:flex;gap:6px;overflow-x:auto;background:var(--wa-bg);border-top:1px solid rgba(0,0,0,.06)}
.wa-q button{flex:none;border:0;background:var(--wa-in);color:var(--wa-fg);border-radius:999px;padding:7px 12px;font-size:.78rem;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.1)}

/* client chat inbox */
.inbox{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;align-items:start}
.clist{display:flex;flex-direction:column;gap:6px}
.conv{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 34px 10px 12px;cursor:pointer;position:relative;width:100%}
.conv:hover{border-color:var(--accent)}
.conv.on{border-color:var(--accent);background:var(--accent-soft)}
.conv .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.conv b{font-size:.86rem}
.conv small{color:var(--muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .lg{font-size:.74rem;font-weight:600;color:var(--ai);white-space:nowrap}
.conv i{position:absolute;right:10px;bottom:9px;font-style:normal;font-size:.68rem;font-weight:600;background:var(--good);color:#fff;border-radius:999px;padding:0 6px}
.cpane{padding:0;overflow:hidden;display:flex;flex-direction:column}
.cpane .chd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.cpane .wa-body{background:var(--wa-bg);min-height:300px;max-height:460px}
.cpane .msg{max-width:78%}
.cfoot{padding:12px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.qr{display:flex;gap:6px;flex-wrap:wrap}
.qr button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:.78rem;cursor:pointer;text-align:left}
.qr button:hover{border-color:var(--accent)}
.compose{display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:44px;max-height:140px;resize:vertical}
.preview{font-size:.82rem;background:var(--ai-soft);border-radius:8px;padding:8px 10px}
.preview span{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ai);display:block}
.status{font-size:.78rem;color:var(--muted);min-height:1em}
details.test{font-size:.82rem}
details.test summary{cursor:pointer;color:var(--accent);font-weight:500}
details.test .compose{margin-top:8px}
.langs{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:900px){.inbox{grid-template-columns:minmax(0,1fr)}.clist{flex-direction:row;overflow-x:auto;padding-bottom:4px}.conv{min-width:210px;max-width:230px}}

.track{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.track span{height:6px;border-radius:3px;background:var(--surface-2)}
.track span.d{background:var(--good)} .track span.c{background:var(--accent)} .track span.x{background:var(--bad)}
.tl{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.tl li{position:relative;padding:0 0 10px 16px;font-size:.82rem}
.tl li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tl li.d::before{background:var(--good);border-color:var(--good)} .tl li.c::before{background:var(--accent);border-color:var(--accent)} .tl li.x::before{background:var(--bad);border-color:var(--bad)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.76rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.field textarea{min-height:120px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-size:.85rem}
.note{font-size:.8rem;padding:8px 10px;border-radius:8px;background:var(--ai-soft);color:var(--fg);display:flex;gap:8px;align-items:flex-start}
.note.bad{background:var(--bad-soft)}
.note .ai-tag{flex:none}

.qdoc{background:#fff;color:#16222c;border-radius:6px;padding:22px;font-size:.8rem;border:1px solid var(--line)}
.qdoc h3{font-family:var(--f-display);font-size:1rem;color:#16222c}
.qdoc .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid #16222c;padding-bottom:10px;margin-bottom:12px}
.qdoc .hd .lt{display:flex;gap:10px;align-items:center}
.qdoc .logo .bg{fill:#1b5ea6} .qdoc .logo .l{fill:#fff} .qdoc .logo .r{fill:#fbeedf}
.qdoc table{font-size:.78rem}
.qdoc th,.qdoc td{border-color:#dfe5ea;color:#16222c;padding:6px}
.qdoc .tot td{font-weight:600}
.qdoc small{color:#5a6b79}

function updQuote(){

 const cost=p.rate*.8+add*.9,margin=(unit-cost)/unit*100;
 const notes=[];
 if(qs.qty<p.moq)notes.push(['bad',T(`Quantity is below MOQ (${num(p.moq)}). Raise it to MOQ, or add ₹1.20/strip.`,`Quantity MOQ (${num(p.moq)}) se kam hai. Ya to MOQ tak badhao, ya ₹1.20/strip extra lagega.`)]);
 if(qs.disc>5)notes.push(['bad',T(`${qs.disc}% is above the rep limit (5%). Sales Head approval is needed before sending.`,`${qs.disc}% discount rep ki limit (5%) se zyada hai. Bhejne se pehle Sales Head ka approval lagega.`)]);
 notes.push([margin<12?'bad':'',T(`Margin after discount: <b>${margin.toFixed(1)}%</b> ${margin<12?'(too low)':'(fine)'}. ${esc(c.name)} took a 3% discount on average over the last 3 orders.`,`Discount ke baad margin: <b>${margin.toFixed(1)}%</b> ${margin<12?'(bahut kam)':'(theek hai)'}. ${esc(c.name)} ne pichhle 3 orders mein average 3% discount liya hai.`)]);
 if(c.cross&&c.cross!=qs.p)notes.push(['',T(`Cross-sell: clients like ${esc(c.name)} also buy ${P[c.cross].s}. Add a line to the quote?`,`Cross-sell: ${esc(c.name)} jaise clients ${P[c.cross].s} bhi lete hain. Quote mein ek line add karein?`)]);
 if(p.st==='Booked')notes.push(['bad',T('Production capacity is booked till 5 Dec. Delivery date moves a week later.','Production capacity 5 Dec tak booked hai. Delivery date 1 hafta aage dikhegi.')]);
 if(c.lg!=='en')notes.push(['',T(`The WhatsApp message with this quote goes to the client in ${LANGS[c.lg][0]}.`,`Is quote ka WhatsApp message client ko ${LANGS[c.lg][0]} mein jaayega.`)]);

 <p><small>To</small><br><b>${esc(c.name)}</b>, ${esc(c.city)}</p>
 <div class="tbl" style="margin:10px 0 0;padding:0"><table><thead><tr><th>Product</th><th>HSN</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>
 <tr><td>${esc(p.c)}<br><small>${p.f} · ${p.pk}${qs.print?' · printed carton':''}${qs.brand?' · client brand foil':''}</small></td><td class="mono">3004</td><td class="r num">${num(qs.qty)}</td><td class="r num">₹${unit.toFixed(2)}</td><td class="r num">₹${num(sub)}</td></tr>
 <tr><td colspan="4" class="r">GST 5%</td><td class="r num">₹${num(gst)}</td></tr>
 <tr><td colspan="4" class="r">Freight</td><td class="r num">${fr?'₹'+num(fr):'Free (FOR)'}</td></tr>
 <tr class="tot"><td colspan="4" class="r">Total</td><td class="r num">₹${num(tot)}</td></tr></tbody></table></div>
 <p style="margin-top:10px"><small>${T('Terms: 50% advance, balance before dispatch · Delivery: 21–28 days after artwork approval · COA with every batch · Shelf life 24 months','Terms: 50% advance, baaki dispatch se pehle · Delivery: artwork approval ke 21–28 din baad · Har batch ke saath COA · Shelf life 24 mahine')}</small></p></div>`;

 else if(/target|sales|mahina|month/.test(q))a=T(`This month ${inr(sum(reps,'achieved'))} / ${inr(sum(reps,'target'))}. Priya is ahead of target. Amit is furthest behind (54%), with 2 big missed reorders.`,`Is mahine ${inr(sum(reps,'achieved'))} / ${inr(sum(reps,'target'))}. Priya target se aage hain. Amit sabse peeche hain (54%), unke 2 bade reorder chhoote hain.`);
 else if(/tender|gem/.test(q))a=T(`Best tender: "${L(tenders[0].t)}", ${tenders[0].match}% match, ${tenders[0].days} days left. The non-conviction certificate is missing.`,`Sabse achha tender: "${L(tenders[0].t)}", ${tenders[0].match}% match, ${tenders[0].days} din bache. Non-conviction certificate abhi kam hai.`)+` <a href="#tenders">${T('Open tenders','Tenders kholo')}</a>`;
 else if(/lead|inquiry/.test(q))a=T(`${leads.filter(l=>l.score>=75&&l.stage!=='Won').length} hot leads. Top: ${leads.filter(l=>l.stage!=='Won').sort((x,y)=>y.score-x.score)[0].name}.`,`${leads.filter(l=>l.score>=75&&l.stage!=='Won').length} hot leads hain. Sabse upar: ${leads.filter(l=>l.stage!=='Won').sort((x,y)=>y.score-x.score)[0].name}.`)+` <a href="#leads">${T('Open leads','Leads kholo')}</a>`;
 else if(/chat|message|language|bhasha/.test(q))a=T(`${sum(convs,'unread')} unread client messages, in Tamil, Gujarati, Bengali, Telugu and Marathi. You read them all in English.`,`${sum(convs,'unread')} client messages padhne baaki hain: Tamil, Gujarati, Bangla, Telugu aur Marathi mein. Aap sab Hinglish mein padh sakte ho.`)+` <a href="#chat">${T('Open chat','Chat kholo')}</a>`;
 else a=T('Try asking: "which client has a pending reorder?", "how much payment is due?", "how is the target?", "any new tender?"','Ye poochh kar dekhiye: "kis client ka reorder pending hai?", "kitna payment baaki hai?", "target kitna hua?", "koi naya tender?"');
 o.innerHTML=`<div class="ch" style="margin:0 0 6px"><span class="ai-tag">${T('AI answer','AI jawab')}</span><button class="btn btn-sm" data-act="askclose">${T('Close','Band karo')}</button></div><p>${a}</p>`;o.hidden=false});
