<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reel</title>
<link rel="stylesheet" href="../node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/inter/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/inter/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/instrument-serif/400-italic.css">
<link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/600.css">
<style>
  :root {
    --bg: #F2EEE5; --ink: #191814; --muted: #8A857A; --line: #191814;
    --card: #FFFDF8; --dark: #1B1A17; --red: #E5484D; --red-soft: #FCE3E1;
    --green: #1F9D61; --green-soft: #DDF3E6; --amber: #F5C542; --claude: #D97757;
    --sans: "Inter", "Inter Display", system-ui, sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
    --mono: "JetBrains Mono", "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 540px; height: 960px; overflow: hidden; background: var(--bg); }
  body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  #frame { position: relative; width: 540px; height: 960px; overflow: hidden; background: var(--bg); }
  #bg { position: absolute; inset: 0; }
  #grain { position: absolute; inset: 0; opacity: .05;
    background-image: radial-gradient(#000 0.6px, transparent 0.6px); background-size: 4px 4px; }
  .abs { position: absolute; }
  .scene { position: absolute; inset: 0; }
  .label { position: absolute; top: 34px; left: 28px; font: 400 12px var(--mono); color: var(--muted); letter-spacing: .02em; }
  .pill-tag { position: absolute; top: 28px; right: 28px; font: 400 11px var(--mono); color: var(--muted);
    border: 1px solid #CFC9BC; border-radius: 99px; padding: 4px 10px; }

  /* cards & chrome */
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 14px; box-shadow: 4px 4px 0 var(--line); }
  .dark-card { background: var(--dark); color: #F2EEE5; border: 2px solid var(--line); border-radius: 14px; box-shadow: 4px 4px 0 #00000040; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font: 800 14px var(--sans); letter-spacing: .04em;
    padding: 6px 12px; border: 2px solid var(--line); border-radius: 8px; box-shadow: 3px 3px 0 var(--line); }
  .num { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center;
    font: 800 13px var(--sans); color: #fff; background: var(--red); }

  /* phone */
  .phone { position: absolute; width: 236px; height: 480px; border-radius: 40px; background: var(--dark);
    border: 3px solid var(--line); box-shadow: 6px 6px 0 var(--line); padding: 9px; }
  .phone .screen { position: relative; width: 100%; height: 100%; border-radius: 31px; overflow: hidden;
    background: radial-gradient(120% 80% at 30% 100%, #8C2F39 0%, #3A1E3F 45%, #141A33 100%); }
  .phone .notch { position: absolute; top: 9px; left: 50%; width: 76px; height: 22px; margin-left: -38px;
    background: #0B0B0B; border-radius: 20px; z-index: 5; }
  .lock-time { position: absolute; top: 58px; width: 100%; text-align: center; color: #fff; font: 700 58px var(--sans); letter-spacing: -.02em; }
  .lock-date { position: absolute; top: 44px; width: 100%; text-align: center; color: #ffffffcc; font: 600 12px var(--sans); }
  .notif { position: absolute; left: 10px; right: 10px; background: #FFFFFFEE; border-radius: 16px; padding: 10px 12px;
    color: #111; font: 400 11.5px/1.4 var(--sans); box-shadow: 0 6px 20px #0005; }
  .notif .app { display: flex; justify-content: space-between; font: 600 10px var(--sans); color: #666; margin-bottom: 3px; text-transform: uppercase; letter-spacing: .04em; }
  .notif b { font-weight: 700; }
  .link { color: #1A5FD0; text-decoration: underline; }
  .notif.debit { background: #FFF1F0; border: 2px solid var(--red); }

  /* captions */
  #captions { position: absolute; left: 30px; right: 30px; top: 642px; height: 110px; }
  .cap { position: absolute; inset: 0; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start;
    gap: 2px 9px; font: 800 29px/1.22 var(--sans); letter-spacing: -.015em; text-align: center; }
  .cap span { display: inline-block; transition: none; }
  #handle { position: absolute; top: 788px; width: 100%; text-align: center; font: 600 12px var(--mono); color: var(--muted); letter-spacing: .04em; }
  #progress { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--ink); }

  /* chat */
  .bubble { position: absolute; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; font: 400 13px/1.45 var(--sans); }
  .who { font: 600 10.5px var(--sans); color: var(--muted); margin-bottom: 4px; display: flex; gap: 6px; align-items: center; letter-spacing: .03em; }
  .row { display: flex; gap: 8px; align-items: flex-start; font: 600 13px/1.4 var(--sans); }
  .x { flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font: 800 11px var(--sans); margin-top: 1px; }
  .ok { flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; margin-top: 1px; }
  .stamp { position: absolute; font: 800 46px var(--sans); color: var(--red); border: 5px solid var(--red); border-radius: 12px; padding: 2px 16px; letter-spacing: .08em; background: #FFFDF8DD; }
  .dots span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 4px; }
  .mono { font-family: var(--mono); }
  .serif { font-family: var(--serif); font-style: italic; font-weight: 400; }
</style>
</head>
<body>
<div id="frame">
  <div id="bg"></div>
  <div id="grain"></div>
  <div id="stage"></div>
  <div id="captions"></div>
  <div id="handle"></div>
  <div id="progress"></div>
</div>

<script>
(() => {
const T = window.TIMELINE;
const stage = document.getElementById("stage");
const anims = [];   // entrance/exit animations
const frames = [];  // per-frame custom updates
window.__warnings = [];

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  out: (p) => 1 - Math.pow(1 - p, 3),
  back: (p) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  inout: (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
};
function el(html, parent) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  const n = t.content.firstElementChild;
  (parent || stage).appendChild(n);
  return n;
}
// Entrance animation: element starts hidden and pops in at `at`.
function pop(node, at, o = {}) {
  anims.push({ node, at, dur: o.dur ?? .45, x: o.x ?? 0, y: o.y ?? 22, s: o.s ?? .94, r: o.r ?? 0,
    e: E[o.ease ?? "out"], hide: o.hide, base: o.base ?? "" });
}
const norm = (s) => s.toLowerCase().normalize("NFKD").replace(/[^\p{L}\p{N}]/gu, "");
// Time when the n-th word starting with `q` is spoken in scene `sc`.
function cue(sc, q, n = 1, off = 0) {
  const want = norm(q);
  let seen = 0;
  for (const c of sc.chunks) for (const w of c.words) {
    if (norm(w.w).startsWith(want) && ++seen === n) return w.start + off;
  }
  window.__warnings.push(`cue "${q}" (#${n}) not found in scene ${sc.id}`);
  return sc.start + (sc.end - sc.start) * .5 + off;
}
const chunkStart = (sc, i, off = 0) => sc.chunks[Math.min(i, sc.chunks.length - 1)].start + off;
// Reveal text char-by-char between t0 and t1.
function typeText(node, text, t0, t1) {
  frames.push((t) => { const n = Math.round(clamp((t - t0) / Math.max(.01, t1 - t0)) * text.length); node.textContent = text.slice(0, n); });
}
const check = `<svg width="11" height="11" viewBox="0 0 12 12"><path d="M2 6.5 5 9l5-6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const sparkle = (c = "var(--claude)", s = 14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><g stroke="${c}" stroke-width="3" stroke-linecap="round">${[0,30,60,90,120,150].map(a=>`<line x1="12" y1="3" x2="12" y2="21" transform="rotate(${a} 12 12)"/>`).join("")}</g></svg>`;
const warnIcon = `<svg width="15" height="15" viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3z" fill="var(--ink)"/><rect x="11" y="9" width="2" height="6" fill="var(--amber)"/><rect x="11" y="17" width="2" height="2" fill="var(--amber)"/></svg>`;

const SC = Object.fromEntries(T.scenes.map((s) => [s.id, s]));
const sceneNodes = [];

// ---------- scene builders ----------
const builders = {
  message(sc, root) {
    const phone = el(`<div class="phone" style="left:152px;top:96px"><div class="notch"></div><div class="screen">
      <div class="lock-date">Tuesday, 12 November</div><div class="lock-time">10:42</div></div></div>`, root);
    const screen = phone.querySelector(".screen");
    pop(phone, sc.start - .05, { y: 40, s: .9 });
    const sms = el(`<div class="notif" style="top:150px"><div class="app"><span>Messages</span><span>now</span></div>
      <b>BK-ALRT</b><br>Dear Customer, your KYC expires <b>TODAY</b>. Update now or account will be BLOCKED:
      <span class="link">bit.ly/kyc-upd8</span></div>`, screen);
    pop(sms, cue(sc, "message", 1, -.15), { y: -30, s: 1 });
    const tap = el(`<div class="abs" style="left:96px;top:225px;width:34px;height:34px;border-radius:50%;border:3px solid #fff;"></div>`, screen);
    const tClick = cue(sc, "click", 1, -.05);
    frames.push((t) => { const p = clamp((t - tClick) / .5); tap.style.opacity = p > 0 && p < 1 ? 1 - p : 0; tap.style.transform = `scale(${.4 + p * 1.4})`; });
    const debit = el(`<div class="notif debit" style="top:262px"><div class="app"><span style="color:var(--red)">Bank</span><span>now</span></div>
      A/c XX4417 <b>debited ₹48,000.00</b>. Avl bal: ₹212.40</div>`, screen);
    const tGone = chunkStart(sc, 3, .1);
    pop(debit, tGone, { y: -24, s: 1 });
    const loss = el(`<div class="card abs" style="left:356px;top:430px;padding:10px 14px;background:var(--red);color:#fff;font:800 30px var(--sans)">−₹48,000</div>`, root);
    pop(loss, cue(sc, "gayab", 1, -.25), { ease: "back", s: .5, y: 0, base: "rotate(-7deg)" });
    frames.push((t) => { const p = clamp((t - tGone) / .45); phone.style.translate = p > 0 && p < 1 ? `${Math.sin(p * 40) * 5 * (1 - p)}px 0` : "0 0"; });
    const note = el(`<div class="abs mono" style="left:34px;top:200px;font-size:11px;color:var(--muted);line-height:1.6">10:42 AM<br>Papa ka phone</div>`, root);
    pop(note, sc.start + .2, { y: 10 });
  },

  trap(sc, root) {
    const badge = el(`<div class="badge abs" style="left:34px;top:96px;background:var(--amber)">${warnIcon} THE TRAP</div>`, root);
    pop(badge, sc.start, { ease: "back", y: 0, s: .6 });
    const quote = el(`<div class="card abs" style="left:34px;top:148px;width:472px;padding:14px 16px;font:400 15px/1.5 var(--sans)">
      <div class="who">BK-ALRT · SMS</div>
      "Your <b>KYC</b> <span id="q1" style="background-image:linear-gradient(var(--red-soft),var(--red-soft));background-repeat:no-repeat;background-size:0% 100%">expires TODAY</span>.
      <span id="q2" style="background-image:linear-gradient(var(--red-soft),var(--red-soft));background-repeat:no-repeat;background-size:0% 100%">Update now</span> or account will be BLOCKED."</div>`, root);
    pop(quote, cue(sc, "message", 1, -.1));
    const q1 = quote.querySelector("#q1"), q2 = quote.querySelector("#q2");
    const t1 = cue(sc, "expire"), t2 = cue(sc, "turant");
    frames.push((t) => { q1.style.backgroundSize = `${clamp((t - t1) / .4) * 100}% 100%`; q2.style.backgroundSize = `${clamp((t - t2) / .4) * 100}% 100%`; });

    const steps = [
      { at: cue(sc, "link", 1, -.1), html: `<span class="num" style="background:var(--ink)">1</span><div><div style="font:800 17px var(--sans)">Link kholo</div><div class="mono" style="font-size:12px;color:#1A5FD0">bit.ly/kyc-upd8</div></div>` },
      { at: cue(sc, "otp", 1, -.1), html: `<span class="num" style="background:var(--ink)">2</span><div><div style="font:800 17px var(--sans)">OTP daalo</div><div class="mono otp" style="font-size:15px;letter-spacing:.3em">______</div></div>` },
      { at: cue(sc, "khel", 1, -.1), html: `<span class="num">3</span><div><div style="font:800 17px var(--sans);color:var(--red)">Khel khatam</div><div class="mono" style="font-size:12px">Balance: ₹212.40</div></div>`, red: true },
    ];
    steps.forEach((s, i) => {
      const top = 296 + i * 100;
      const n = el(`<div class="card abs" style="left:34px;top:${top}px;width:300px;padding:12px 14px;display:flex;gap:12px;align-items:center;${s.red ? "background:var(--red-soft);border-color:var(--red);box-shadow:4px 4px 0 var(--red)" : ""}">${s.html}</div>`, root);
      pop(n, s.at, { x: -30, y: 0 });
      if (i > 0) {
        const arr = el(`<svg class="abs" style="left:58px;top:${top - 32}px" width="20" height="30"><path d="M10 2v22M4 18l6 7 6-7" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/></svg>`, root);
        pop(arr, s.at - .1, { y: -8 });
      }
    });
    const otp = root.querySelector(".otp"), digits = "482917", tO = steps[1].at + .15;
    frames.push((t) => { const n = Math.round(clamp((t - tO) / .6) * 6); otp.textContent = digits.slice(0, n) + "______".slice(n); });
    const hook = el(`<div class="abs serif" style="left:356px;top:330px;width:160px;font-size:30px;line-height:1.05;color:var(--red)">sirf<br>30 second<br>ka kaam.</div>`, root);
    pop(hook, steps[2].at + .3, { y: 14 });
  },

  fix(sc, root) {
    const shield = el(`<svg class="abs" style="left:190px;top:110px" width="160" height="186" viewBox="0 0 160 186">
      <path id="sh" d="M80 6 148 32v52c0 44-30 78-68 96C42 162 12 128 12 84V32z" fill="var(--green)" fill-opacity="0" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
      <path id="ck" d="M48 94l22 22 44-48" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>`, root);
    const sh = shield.querySelector("#sh"), ck = shield.querySelector("#ck");
    const L = 470, LC = 110, t0 = sc.start + .05, tFill = cue(sc, "bana", 1, -.2);
    sh.style.strokeDasharray = L; ck.style.strokeDasharray = LC;
    frames.push((t) => {
      sh.style.strokeDashoffset = L * (1 - E.inout(clamp((t - t0) / 1.1)));
      sh.setAttribute("fill-opacity", E.out(clamp((t - tFill) / .35)));
      ck.style.strokeDashoffset = LC * (1 - E.out(clamp((t - tFill - .15) / .35)));
      const p = clamp((t - tFill) / .5);
      shield.style.transform = `scale(${1 + Math.sin(p * Math.PI) * .08})`;
    });
    const l1 = el(`<div class="abs" style="left:0;width:540px;top:322px;text-align:center;font:800 40px var(--sans);letter-spacing:-.02em">Papa ka</div>`, root);
    pop(l1, cue(sc, "papa", 1, -.15));
    const l2 = el(`<div class="abs serif" style="left:0;width:540px;top:366px;text-align:center;font-size:70px;line-height:1;color:var(--green)">AI scam-guard</div>`, root);
    pop(l2, cue(sc, "ai", 1, -.1), { y: 30, s: .85, ease: "back" });
    ["link check", "OTP alert", "urgency detector"].forEach((txt, i) => {
      const left = [60, 196, 316][i];
      const chip = el(`<div class="abs card" style="left:${left}px;top:480px;padding:7px 12px;border-radius:99px;font:700 13px var(--sans);display:flex;gap:6px;align-items:center;box-shadow:3px 3px 0 var(--line)"><span class="ok" style="width:16px;height:16px">${check}</span>${txt}</div>`, root);
      pop(chip, cue(sc, "bana", 1, .25 + i * .18), { y: 16, ease: "back" });
    });
  },

  check(sc, root) {
    const win = el(`<div class="card abs" style="left:28px;top:92px;width:484px;height:440px;overflow:hidden">
      <div style="display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:2px solid var(--line);font:700 14px var(--sans)">
        ${sparkle()} Claude <span class="mono" style="margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:400">scam-guard chat</span></div></div>`, root);
    pop(win, sc.start - .05, { y: 30, s: .96 });
    const papa = el(`<div class="bubble" style="right:14px;top:62px;width:320px;background:#ECE7DC">
      <div class="who">PAPA · forwarded</div>"Dear Customer, your KYC expires TODAY. Update now or account will be BLOCKED: <span class="link">bit.ly/kyc-upd8</span>"</div>`, win);
    pop(papa, cue(sc, "paste", 1, -.15), { x: 30, y: 0 });
    const typing = el(`<div class="bubble dots" style="left:14px;top:190px;background:#fff;padding:12px 14px"><span></span><span></span><span></span></div>`, win);
    const tJ = cue(sc, "jawab", 1, -.1), tF = cue(sc, "fraud", 1, -.35);
    frames.push((t) => {
      typing.style.opacity = t > tJ && t < tF ? 1 : 0;
      [...typing.children].forEach((d, i) => (d.style.transform = `translateY(${Math.sin(t * 10 - i * .9) * 2.5}px)`));
    });
    const reply = el(`<div class="bubble" style="left:14px;top:190px;width:400px;background:#fff">
      <div class="who">${sparkle(undefined, 11)} CLAUDE</div>
      <div style="font:800 18px var(--sans);color:var(--red);margin-bottom:8px">Ye FRAUD hai — click mat karna.</div>
      <div class="r1 row" style="margin-bottom:7px"><span class="x">✕</span><span>"Aaj hi BLOCK" — darr dikha ke jaldi karwana</span></div>
      <div class="r2 row" style="margin-bottom:7px"><span class="x">✕</span><span>bit.ly link — asli bank ka domain nahi</span></div>
      <div class="r3 row"><span class="x">✕</span><span>Bank kabhi SMS link pe OTP/KYC nahi maangta</span></div></div>`, win);
    pop(reply, tF, { y: 18 });
    pop(reply.querySelector(".r1"), tF + .5, { x: -14, y: 0 });
    pop(reply.querySelector(".r2"), cue(sc, "link", 1, -.1), { x: -14, y: 0 });
    pop(reply.querySelector(".r3"), cue(sc, "otp", 1, -.25), { x: -14, y: 0 });
    const stamp = el(`<div class="stamp" style="left:300px;top:392px">SCAM</div>`, root);
    pop(stamp, cue(sc, "fraud", 1, .05), { ease: "back", s: 1.8, y: 0, dur: .35, base: "rotate(-12deg)" });
  },

  setup(sc, root) {
    const head = el(`<div class="abs" style="left:34px;top:92px;display:flex;align-items:center;gap:10px">
      <span class="badge" style="background:var(--green-soft)"><svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="var(--ink)" stroke-width="2.6"/><path d="M12 9v4l3 2M9 2h6" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/></svg> 2 MIN SETUP</span></div>`, root);
    pop(head, sc.start, { ease: "back", y: 0, s: .6 });
    // step 1: account
    const s1 = el(`<div class="card abs" style="left:34px;top:146px;width:472px;padding:14px 16px">
      <div style="display:flex;gap:10px;align-items:center;font:800 18px var(--sans);margin-bottom:10px"><span class="num" style="background:var(--ink)">1</span>Free account</div>
      <div style="border:1.5px solid #CFC9BC;border-radius:10px;overflow:hidden">
        <div class="mono" style="font-size:10.5px;color:var(--muted);padding:6px 10px;border-bottom:1.5px solid #E2DDD2">● ● ●&nbsp;&nbsp; claude.ai</div>
        <div style="padding:10px 12px">
          <div style="font:700 15px var(--sans);margin-bottom:8px">Create your free account</div>
          <div class="mono email" style="font-size:12px;border:1.5px solid #CFC9BC;border-radius:7px;padding:7px 9px;height:32px;margin-bottom:8px"></div>
          <div class="btn" style="font:700 13px var(--sans);text-align:center;color:#fff;background:var(--ink);border-radius:7px;padding:8px">Continue</div>
        </div></div></div>`, root);
    const tS1 = cue(sc, "ek", 1, -.1), tDone1 = cue(sc, "banao", 1, .1);
    pop(s1, tS1);
    typeText(s1.querySelector(".email"), "papa.sharma@gmail.com", tS1 + .4, tDone1 - .2);
    const btn = s1.querySelector(".btn");
    frames.push((t) => { const done = t > tDone1; btn.style.background = done ? "var(--green)" : "var(--ink)"; btn.textContent = done ? "✓ Account ready" : "Continue"; });
    // step 2: prompt
    const s2 = el(`<div class="dark-card abs" style="left:34px;top:388px;width:472px;padding:14px 16px">
      <div style="display:flex;gap:10px;align-items:center;font:800 18px var(--sans);margin-bottom:10px"><span class="num" style="background:var(--claude)">2</span>Scam-check prompt
        <span class="ok s2ok" style="margin-left:auto;opacity:0">${check}</span></div>
      <div class="mono ptxt" style="font-size:11.5px;line-height:1.55;color:#E8E2D4;min-height:72px;white-space:pre-wrap"></div></div>`, root);
    const tS2 = cue(sc, "do", 2, -.1), tPaste = cue(sc, "paste", 1);
    pop(s2, tS2);
    typeText(s2.querySelector(".ptxt"), "> Tum meri family ke scam-checker ho.\n  Har message mein check karo: link,\n  urgency, OTP/KYC maangna... [+38 lines]", tS2 + .3, tPaste);
    const ok2 = s2.querySelector(".s2ok");
    frames.push((t) => { ok2.style.opacity = t > tPaste + .1 ? 1 : 0; });
    // send bar
    const bar = el(`<div class="card abs" style="left:34px;top:556px;width:472px;padding:9px 10px 9px 16px;border-radius:99px;display:flex;align-items:center;font:600 13px var(--sans);color:var(--muted)">
      Shak wala message yahin bhejo…<span style="margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--claude);display:grid;place-items:center">
      <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 20V5M5 11l7-7 7 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>`, root);
    pop(bar, cue(sc, "bas", 1, -.1), { y: 18 });
  },

  cta(sc, root) {
    const title = el(`<div class="abs" style="left:34px;top:96px;font:800 44px var(--sans);letter-spacing:-.025em">Comment karo</div>`, root);
    pop(title, sc.start - .05);
    const word = el(`<div class="abs card" style="left:350px;top:94px;padding:2px 14px;background:var(--red);color:#fff;font:800 40px var(--sans)">SCAM</div>`, root);
    pop(word, cue(sc, "scam", 1, -.2), { ease: "back", s: .4, y: 0, base: "rotate(4deg)" });
    const box = el(`<div class="card abs" style="left:34px;top:178px;width:472px;padding:12px 16px">
      <div style="font:800 15px var(--sans);margin-bottom:8px">Comments</div></div>`, root);
    pop(box, cue(sc, "comment", 1, -.1));
    const people = [["#E5484D", "ri***"], ["#1F9D61", "ad***"], ["#D97757", "ne***"], ["#191814", "you · now"]];
    const tc = cue(sc, "comment", 1, .15);
    people.forEach(([c, n], i) => {
      const r = el(`<div style="display:flex;align-items:center;gap:10px;padding:6px 0;font:600 13px var(--sans)">
        <span style="width:24px;height:24px;border-radius:50%;background:${c}"></span><span class="mono" style="font-size:12px;color:var(--muted)">@${n}</span>
        <span style="background:var(--red);color:#fff;font:800 11px var(--sans);padding:3px 8px;border-radius:5px">SCAM</span>
        <span style="margin-left:auto;color:${i === 3 ? "var(--red)" : "#CFC9BC"}">♥</span></div>`, box);
      pop(r, tc + i * .32, { y: 10 });
    });
    const gift = el(`<div class="card abs" style="left:34px;top:430px;width:472px;padding:14px 16px;background:var(--green-soft)">
      <div class="who">DM · from ${T.handle}</div>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:46px;height:46px;border-radius:10px;background:var(--dark);display:grid;place-items:center">${sparkle(undefined, 22)}</div>
        <div><div style="font:800 17px var(--sans)">Papa ka AI scam-guard</div>
        <div class="mono" style="font-size:11.5px;color:#3d5a49">✓ Prompt  ✓ Setup guide</div></div></div></div>`, root);
    pop(gift, cue(sc, "mil", 1, -.25), { y: 26 });
    const free = el(`<div class="badge abs" style="left:420px;top:414px;background:var(--green);color:#fff">FREE</div>`, root);
    pop(free, cue(sc, "mil", 1, .1), { ease: "back", s: .4, y: 0, base: "rotate(8deg)" });
    const follow = el(`<div class="abs" style="left:0;width:540px;top:556px;text-align:center;font:700 15px var(--sans);color:var(--muted)">Follow <span style="color:var(--ink)">${T.handle}</span> — aisi aur AI tricks ke liye</div>`, root);
    pop(follow, sc.end + .2);
  },
};

// ---------- build scenes ----------
T.scenes.forEach((sc, i) => {
  const root = el(`<div class="scene"><div class="label">${sc.label}</div><div class="pill-tag">voice: AI</div></div>`);
  const next = T.scenes[i + 1];
  sceneNodes.push({ sc, root, from: sc.start - .25, to: next ? next.start - .25 : T.duration + 1 });
  (builders[sc.id] || (() => window.__warnings.push(`no builder for scene ${sc.id}`)))(sc, root);
});

// ---------- captions ----------
const capRoot = document.getElementById("captions");
const caps = [];
T.scenes.forEach((sc) => sc.chunks.forEach((c, i) => {
  const node = el(`<div class="cap"></div>`, capRoot);
  const spans = c.words.map((w) => { const s = document.createElement("span"); s.textContent = w.w; node.appendChild(s); return { s, w }; });
  const next = sc.chunks[i + 1];
  caps.push({ node, spans, tint: sc.tint, from: c.start - .08, to: next ? next.start - .08 : c.end + .45 });
}));
document.getElementById("handle").textContent = T.handle;

// ---------- background ----------
const bg = document.getElementById("bg");
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

// ---------- seek ----------
window.seek = (t) => {
  for (const s of sceneNodes) {
    const vis = t >= s.from && t < s.to;
    s.root.style.display = vis ? "block" : "none";
    if (vis) {
      const outP = clamp((t - (s.to - .22)) / .22);
      s.root.style.opacity = 1 - outP;
      s.root.style.transform = `translateY(${-outP * 24}px)`;
    }
  }
  for (const a of anims) {
    const p = clamp((t - a.at) / a.dur), ep = a.e(p);
    let o = clamp(p * 2);
    if (a.hide != null) o *= 1 - clamp((t - a.hide) / .25);
    a.node.style.opacity = o;
    a.node.style.transform = `${a.base} translate(${a.x * (1 - ep)}px, ${a.y * (1 - ep)}px) scale(${a.s + (1 - a.s) * ep}) rotate(${a.r * (1 - ep)}deg)`;
  }
  for (const f of frames) f(t);
  for (const c of caps) {
    const vis = t >= c.from && t < c.to;
    c.node.style.display = vis ? "flex" : "none";
    if (!vis) continue;
    const p = E.out(clamp((t - c.from) / .16));
    c.node.style.opacity = p;
    c.node.style.transform = `translateY(${(1 - p) * 10}px)`;
    for (const { s, w } of c.spans) {
      const said = t >= w.start - .03;
      const active = said && t < w.end + .08;
      s.style.color = w.accent && said ? c.tint === "#F5C542" ? "#C98F00" : c.tint : "var(--ink)";
      s.style.opacity = said ? 1 : .22;
      s.style.transform = active ? "scale(1.06)" : "scale(1)";
    }
  }
  // tinted glow drifting behind everything, colour follows the current scene
  let cur = T.scenes[0];
  for (const s of T.scenes) if (t >= s.start - .25) cur = s;
  const [r, g, b] = hex2rgb(cur.tint);
  const x = 62 + Math.sin(t * .35) * 14, y = 52 + Math.cos(t * .27) * 10;
  bg.style.background = `radial-gradient(42% 30% at ${x}% ${y}%, rgba(${r},${g},${b},.20), transparent 70%)`;
  document.getElementById("progress").style.width = `${clamp(t / T.duration) * 100}%`;
};
window.seek(0);
})();
</script>
</body>
</html>
